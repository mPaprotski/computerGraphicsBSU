name: Build Lab 4 Windows executable

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Lab_4/requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Lab_4/requirements.txt pyinstaller==6.16.0

      - name: Build executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name main `
            --paths Lab_4 `
            Lab_4/main.py

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: Lab_4-Windows
          path: dist/main.exe
          if-no-files-found: error
